name: Build Android APK

# Lancer à la main : onglet Actions → "Build Android APK" → Run workflow.
# Aucun secret n'est injecté : les clés API se saisissent dans l'app au premier lancement.
# Le dernier APK est aussi publié comme « version » GitHub (lien direct, sans zip à décompresser) :
#   https://github.com/<propriétaire>/<dépôt>/releases/tag/latest-apk
# L'APK ne contient aucune clé API (elles se saisissent dans l'app) : le dépôt peut rester public.
on:
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la version « latest-apk »

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Gradle init script — Maven Central through Google's mirror
        run: |
          # On the GitHub runners repo.maven.apache.org redirects some jars (the Kotlin compiler) to github.com/…/releases, which has been
          # answering 504: Google's public mirror of Maven Central serves the same files.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def swap = { repos ->
            repos.all { repo ->
              if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org')) {
                repo.setUrl(mirror)
              }
            }
          }
          beforeSettings { settings ->
            swap(settings.pluginManagement.repositories)
            swap(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
            swap(buildscript.repositories)
            swap(repositories)
          }
          EOF
          cat ~/.gradle/init.d/central-mirror.gradle

      - name: Fetch Gradle (retries, official CDN host)
        working-directory: android
        run: |
          # services.gradle.org (the redirector) sometimes answers 504: ask the download host directly and retry for a few minutes.
          sed -i 's#https\\://services.gradle.org/distributions/#https\\://downloads.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3 4 5 6; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt $attempt), waiting before the next one"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build release APK (JS bundled, signed with the debug key — fine for sideloading)
        working-directory: android
        run: |
          # The dependencies are downloaded from Maven Central / GitHub releases, which sometimes answer 504: what was already
          # downloaded stays in the Gradle cache, so a second and a third pass only fetch what is missing.
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Gradle build failed (attempt $attempt), waiting before the next one"
            sleep $((attempt * 30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dualcast-translate-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Publish the APK as the "latest-apk" GitHub release (direct download link)
        continue-on-error: true # the zip artifact above stays available if the release cannot be written
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DualCast-Translate.apk
          # The same APK inside a zip: some phones' browsers get stuck "finalising" a downloaded .apk (security scan);
          # a zip is saved as is, then unzipped with the Files app.
          zip DualCast-Translate.zip DualCast-Translate.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk DualCast-Translate.apk DualCast-Translate.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "DualCast Translate — dernier APK" \
            --notes "Build #${{ github.run_number }} — commit ${GITHUB_SHA::7} (branche ${{ github.ref_name }}). Téléchargez DualCast-Translate.apk puis installez-le par-dessus l'ancienne version : clés et réglages sont conservés."
